name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go-version }}
          path: coverage.out

      - name: Build
        run: go build -o api-server ./cmd/api

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      # Uses standard docker build to guarantee the image is accessible to the Trivy container
      - name: Build Docker image locally
        run: docker build -t product-catalog:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (Fail Build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "product-catalog:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy vulnerability scanner (Generate JSON Report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "product-catalog:${{ github.sha }}"
          format: "json"
          output: "trivy-results.json"

      - name: Upload Trivy scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-results.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version: "1.24"
          package: "./..."
