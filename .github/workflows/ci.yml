name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
        # TODO: Add go-version "1.25" to the matrix for multi-version testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out

      - name: Build
        run: go build -o api-server ./cmd/api

  # TODO: Add lint job using golangci-lint
  # Hint: Use the golangci/golangci-lint-action@v4 action

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: product-catalog:${{ github.sha }}

      - name: Run Trivy vulnerability scanner (Fail Build)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: "product-catalog:${{ github.sha }}"
          format: "table"
          exit-code: "1" # Fails the pipeline if vulnerabilities match criteria
          severity: "CRITICAL,HIGH"

      - name: Run Trivy vulnerability scanner (Generate JSON Report)
        if: always() # Ensures the report is built even if the previous step failed
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: "product-catalog:${{ github.sha }}"
          format: "json"
          output: "trivy-results.json"

      - name: Upload Trivy scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-results.json

  # TODO: Add sonarcloud job
  # Hint: Use the SonarSource/sonarqube-scan-action or sonarcloud-github-action
  # You will need to configure sonar-project.properties

  # TODO: Add vulnerability-scan job using govulncheck
  # Hint: Install with "go install golang.org/x/vuln/cmd/govulncheck@latest"

  # TODO: Add trivy-scan job for Docker image vulnerability scanning
  # Hint: Use aquasecurity/trivy-action@master after the docker-build job
